name: PromButter CI/CD

on:
  push:
    branches:
      - dev
      - main
      - dev
    tags:
      - 'v*'
  # 머지 전에 테스트를 돌려서 dev 가 깨지는 것을 막는다.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prombutter
          POSTGRES_PASSWORD: password
          POSTGRES_DB: prombutter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 모든 텍스트 파일이 BOM 없는 UTF-8 인지 확인한다.
      # 실패하면 test job 이 멈추고, deploy job 은 needs: test 라 실행되지 않는다.
      - name: Check Encoding (UTF-8)
        run: python scripts/check_encoding.py

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Initialize Database
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U prombutter -d prombutter_test -f db/migrations/0001_init.sql
          psql -h localhost -U prombutter -d prombutter_test -f db/migrations/0002_add_unique_constraints.sql

      - name: Check UTF-8 Encoding
        run: |
          python -c "
          import os, sys
          failed = False
          for root, _, files in os.walk('.'):
              if '.venv' in root or '.git' in root: continue
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              f.read()
                          with open(filepath, 'rb') as f:
                              if f.read(3) == b'\xef\xbb\xbf':
                                  print(f'Error: {filepath} has UTF-8 BOM')
                                  failed = True
                      except UnicodeDecodeError:
                          print(f'Error: {filepath} is not valid UTF-8')
                          failed = True
          if failed: sys.exit(1)
          print('All Python files are properly UTF-8 encoded (without BOM).')
          "

      - name: Run Pytest
        env:
          SECRET_KEY: test_secret_key_for_ci
          DATABASE_URL: "postgresql+asyncpg://prombutter:password@localhost:5432/prombutter_test"
        run: |
          uv run pytest tests/

  deploy:
    name: Deploy to GCP
    needs: test
    # 배포 조건은 기존과 동일하게 유지한다 — main 푸시와 v* 태그일 때만.
    # dev 푸시나 PR 에서는 test job 만 돌고 배포는 하지 않는다.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set target environment
        id: env-setter
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "SERVICE_NAME=prombutter-api-prod" >> $GITHUB_ENV
          else
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "SERVICE_NAME=prombutter-api-staging" >> $GITHUB_ENV
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          echo "APP_ENV: '${ENV_NAME}'" > env.yaml
          echo "SECRET_KEY: '${{ secrets.SECRET_KEY }}'" >> env.yaml
          echo "DATABASE_URL: '${{ secrets.DATABASE_URL }}'" >> env.yaml
          echo "CORS_ORIGINS: '${{ secrets.CORS_ORIGINS }}'" >> env.yaml
          
          gcloud run deploy $SERVICE_NAME \
            --source . \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --env-vars-file=env.yaml
          
          echo "Deployment to $ENV_NAME triggered successfully."
