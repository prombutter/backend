name: PromButter CI

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  # 머지 전에 테스트를 돌려서 dev 가 깨지는 것을 막는다.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prombutter
          POSTGRES_PASSWORD: password
          POSTGRES_DB: prombutter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 텍스트 파일의 UTF-8 인코딩과 확장별 BOM 정책을 확인한다.
      - name: Check Encoding (UTF-8)
        run: python scripts/check_encoding.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify extension developer login
        run: node --test extension/tests/developer-login.test.mjs

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # 격리된 테스트 DB 에 마이그레이션 러너를 적용한다.
      - name: Initialize Database
        run: |
          bash scripts/apply_migrations.sh \
            "postgresql://prombutter:password@localhost:5432/prombutter_test"

      # 같은 테스트 DB 에 재적용해도 안전한지 확인한다.
      - name: Verify migrations are re-runnable
        run: |
          bash scripts/apply_migrations.sh \
            "postgresql://prombutter:password@localhost:5432/prombutter_test"

      - name: Run Pytest
        env:
          SECRET_KEY: test_secret_key_for_ci
          DATABASE_URL: "postgresql+asyncpg://prombutter:password@localhost:5432/prombutter_test"
        run: |
          uv run pytest tests/
