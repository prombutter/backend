name: PromButter CI/CD

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  # 머지 전에 테스트를 돌려서 dev 가 깨지는 것을 막는다.
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# 같은 대상에 배포가 겹치면 마이그레이션이 동시에 돌 수 있다. 한 줄로 세운다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prombutter
          POSTGRES_PASSWORD: password
          POSTGRES_DB: prombutter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 모든 텍스트 파일이 BOM 없는 UTF-8 인지 확인한다.
      # 실패하면 test job 이 멈추고, deploy job 은 needs: test 라 실행되지 않는다.
      - name: Check Encoding (UTF-8)
        run: python scripts/check_encoding.py

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # 테스트 DB 도 운영과 같은 러너로 세운다. 운영에서만 처음 돌아가는 스크립트를
      # 만들지 않기 위해서다. 마이그레이션 경로 자체가 매 푸시 검증된다.
      - name: Initialize Database
        run: |
          bash scripts/apply_migrations.sh \
            "postgresql://prombutter:password@localhost:5432/prombutter_test"

      # 두 번 돌려도 안전한지 여기서 확인한다. 운영 배포는 재시도가 흔하다.
      - name: Verify migrations are re-runnable
        run: |
          bash scripts/apply_migrations.sh \
            "postgresql://prombutter:password@localhost:5432/prombutter_test"

      - name: Run Pytest
        env:
          SECRET_KEY: test_secret_key_for_ci
          DATABASE_URL: "postgresql+asyncpg://prombutter:password@localhost:5432/prombutter_test"
        run: |
          uv run pytest tests/

  deploy:
    name: Deploy to Cloud Run
    needs: test
    # dev 푸시는 staging, main 푸시와 v* 태그는 production 으로 간다.
    # PR 에서는 test 만 돈다.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/dev' && 'staging') || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set target environment
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "SERVICE_NAME=prombutter-api-staging" >> $GITHUB_ENV
          else
            echo "ENV_NAME=production" >> $GITHUB_ENV
            echo "SERVICE_NAME=prombutter-api-prod" >> $GITHUB_ENV
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 배포보다 먼저 돈다. 실패하면 여기서 잡이 멈추고 새 리비전은 뜨지 않는다.
      # 스키마가 없는 코드가 살아나 500 을 쏟는 것보다, 옛 리비전이 계속 도는 편이 낫다.
      - name: Apply DB migrations
        env:
          TARGET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$TARGET_DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL 시크릿이 비어 있습니다. 마이그레이션 없이 배포할 수 없습니다."
            exit 1
          fi
          bash scripts/apply_migrations.sh "$TARGET_DATABASE_URL"

      - name: Build env file
        env:
          APP_ENV: ${{ env.ENV_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'true' }}
          # PB-140 확정: FE(vercel.app) 와 API(run.app) 가 서로 다른 사이트이고
          # 익스텐션은 어떤 구성에서도 크로스 사이트다. none 이라야 세션이 전송된다.
          COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE || 'none' }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES || '60' }}
          REFRESH_TOKEN_EXPIRE_MINUTES: ${{ vars.REFRESH_TOKEN_EXPIRE_MINUTES || '10080' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OAUTH_TOKEN_KEY: ${{ secrets.OAUTH_TOKEN_KEY }}
          OAUTH_CALLBACK_URL: ${{ vars.OAUTH_CALLBACK_URL }}
          OAUTH_FRONTEND_REDIRECT: ${{ vars.OAUTH_FRONTEND_REDIRECT }}
          OAUTH_ALLOWED_REDIRECTS: ${{ vars.OAUTH_ALLOWED_REDIRECTS }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
        # echo 로 따옴표를 직접 두르면 값 안의 따옴표나 줄바꿈에서 YAML 이 깨진다.
        # 시크릿은 눈으로 확인할 수 없으니 이스케이프를 파서에 맡긴다.
        run: python3 scripts/build_env_yaml.py

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --env-vars-file=env.yaml

      # B2. 배포된 API 도메인을 사람이 찾아다니지 않아도 되게 남긴다.
      # 익스텐션 manifest 의 host_permissions 가 이 값을 기다리고 있다.
      - name: Report service URL
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region asia-northeast3 --format='value(status.url)')
          {
            echo "### ${ENV_NAME} 배포 완료"
            echo ""
            echo "- 서비스: ${SERVICE_NAME}"
            echo "- API URL: ${URL}"
          } >> $GITHUB_STEP_SUMMARY
          curl -fsS --max-time 30 "${URL}/health" \
            || echo "::warning::헬스체크가 응답하지 않았습니다 (${URL}/health)"

      - name: Remove env file
        if: always()
        run: rm -f env.yaml
