name: PromButter CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prombutter
          POSTGRES_PASSWORD: password
          POSTGRES_DB: prombutter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Initialize Database
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U prombutter -d prombutter_test -f db/migrations/0001_init.sql
          psql -h localhost -U prombutter -d prombutter_test -f db/migrations/0002_add_unique_constraints.sql

      - name: Run Pytest
        env:
          SECRET_KEY: test_secret_key_for_ci
          DATABASE_URL: "postgresql+asyncpg://prombutter:password@localhost:5432/prombutter_test"
        run: |
          uv run pytest tests/

  deploy:
    name: Deploy to GCP
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          echo "Triggering Render deployment via Deploy Hook..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully."
